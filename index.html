<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d1117">
<title>Imperial bot dashboard</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="lock" class="lock">
  <form id="lockform" class="card lockcard" autocomplete="on">
    <h1>Imperial bot dashboard</h1>
    <p class="muted">The data on this page is encrypted. Enter your dashboard password to unlock it.</p>
    <input type="text" name="username" value="imperial-dashboard" autocomplete="username" hidden>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
    <label class="check"><input id="remember" type="checkbox"> Remember on this device</label>
    <button id="unlock" type="submit">Unlock</button>
    <p id="lockerr" class="err" role="alert"></p>
  </form>
</div>
<main id="app" hidden></main>
<script src="app.js"></script>
</body>
</html>
